services:
  mongo:
    image: mongo:8
    container_name: restaurants-mongo
    # Replica set de un solo nodo: Mongo solo permite transacciones (crear
    # pedido + registrar pago en un paso) y change streams dentro de un replica
    # set, también en local. Sin esto el código funcionaría en desarrollo y
    # fallaría en producción, o al revés.
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo_data:/data/db
    # El healthcheck inicia el replica set la primera vez y después solo
    # confirma que responde. `localhost` como host del miembro es lo que deja
    # conectar desde la máquina con el puerto publicado.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
